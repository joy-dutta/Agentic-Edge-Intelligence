name: reproducibility-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Scan for credentials
        run: python scripts/secret_scan.py
      - name: Verify release manifest and private-file exclusions
        run: python scripts/verify_release.py
      - name: Verify documentation links
        run: python scripts/verify_docs.py
      - name: Run offline tests
        run: python -m pytest -q
        env:
          PYTHONPATH: src
      - name: Recompute and verify released result tables
        run: python scripts/verify_results.py
        env:
          PYTHONPATH: src

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned reproducibility container
        run: docker build --file Dockerfile.release --tag agentic-edge-traffic-poc:ci .
      - name: Verify package inside the container
        run: docker run --rm agentic-edge-traffic-poc:ci python scripts/verify_release.py
