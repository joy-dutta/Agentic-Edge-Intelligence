name: Bug report
description: Report a reproducible code, experiment, or documentation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private paths, account details, or unredacted payloads.
  - type: input
    id: version
    attributes:
      label: Repository commit
      description: Output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Reproduction level
      options:
        - Level A - table and integrity verification
        - Level B - offline SUMO simulation
        - Level C - live LLM-assisted run
        - Documentation only
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and observed behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, SUMO, Docker, and relevant package versions. Remove personal paths.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, local account information, private paths, and unredacted API content.
          required: true

